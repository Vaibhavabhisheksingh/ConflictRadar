services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    ports:
      - "4000:4000"
    # environment:
    #   PORT: 4000
    #   MONGO_URI: mongodb://mongo:27017/conflictradar
    #   CORS_ORIGIN: http://localhost:3000
    #   JWT_SECRET: here_i_am_learner

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo_data:
